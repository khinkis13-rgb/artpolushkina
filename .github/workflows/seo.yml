# Пересобирает статические страницы работ (/work/<id>/, /en/work/<id>/), «Все работы», превью для ссылок
# и sitemap.xml, когда админка Маши меняет каталог или картинки. Коммит — только сгенерированные пути,
# отдельным коммитом бота. После выкладки — IndexNow (Яндекс, Bing) по изменённым адресам.
# Push бота через GITHUB_TOKEN не запускает workflow повторно, а Pages собирает и его коммиты.
name: Страницы работ

on:
  push:
    branches: [main]
    paths:
      - catalog.json
      - content.json
      - index.html
      - site/images/**
      - tools/seo/**
      - .github/workflows/seo.yml
  workflow_dispatch:

permissions:
  contents: write

# админка делает несколько коммитов на одно сохранение: прогоны идут по очереди, последний видит итог
concurrency:
  group: seo-pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pillow
        run: pip install pillow

      - name: Сборка страниц
        run: python3 tools/seo/build.py --changed "$RUNNER_TEMP/changed.txt"

      - name: Коммит, если страницы изменились
        id: commit
        run: |
          git add work en/work site/og sitemap.xml tools/seo/state.json
          if git diff --cached --quiet; then
            echo "Страницы не изменились — коммита нет"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Страницы работ обновлены'
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push не прошёл (попытка $i), повторяю"
            sleep 5
          done
          exit 1

      - name: IndexNow
        if: steps.commit.outputs.pushed == '1'
        run: python3 tools/seo/indexnow.py "$RUNNER_TEMP/changed.txt" --wait 300 || true
